name: CD

# Roda quando alguém cria uma tag de versão, por exemplo v1.0.0
on:
  push:
    tags: ["v*.*.*"]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  publicar:
    runs-on: ubuntu-latest
    needs: testes
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}

  deploy-homologacao:
    runs-on: ubuntu-latest
    needs: publicar
    permissions:
      contents: read
      packages: read
    env:
      DB_NAME: tarefas_homolog
      DB_USER: tarefas
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Definir a imagem desta versão
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$VERSAO" >> "$GITHUB_ENV"
      - name: Subir a aplicação (ambiente de homologação simulado)
        run: |
          docker compose pull app
          docker compose up -d --no-build
      - name: Teste rápido
        run: bash scripts/smoke_test.sh http://localhost:8000 "$VERSAO"
      - name: Mostrar logs se falhar
        if: failure()
        run: docker compose logs
      - name: Desligar
        if: always()
        run: docker compose down -v
