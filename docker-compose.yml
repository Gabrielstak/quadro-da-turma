services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no arquivo .env}
      POSTGRES_USER: ${DB_USER:?defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    # Em homologação o pipeline define APP_IMAGE com a versão publicada.
    image: ${APP_IMAGE:-tarefas-app:local}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
